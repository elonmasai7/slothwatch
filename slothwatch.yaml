app:
  data_dir: data/real
  state_dir: .slothwatch
  database: .slothwatch/slothwatch.sqlite3
  timezone: Africa/Nairobi
  run_mode: real
  fast_demo_seconds: 60
  default_currency: USD
rules:
  duplicate_window_days: 3
  small_new_merchant_amount: 15.0
  recurring_min_observations: 4
  forecast_lower_quantile: 0.05
  forecast_upper_quantile: 0.95
  mad_multiplier: 3.5
  creep_window: 4
  creep_total_pct: 8.0
  high_severity_amount: 250.0
  learning_threshold: 0.25
  ignore_merchants:
  - hello
  allow_merchants: []
llm:
  provider: ollama
  endpoint: http://127.0.0.1:11434/api/generate
  model: gemma3:4b
  timeout_seconds: 20
  enabled: true
orchestration:
  temporal_endpoint: 127.0.0.1:7233
  task_queue: slothwatch-local
  use_temporal: false
tracing:
  sentry_dsn_env: SENTRY_DSN
  local_trace_file: .slothwatch/traces/trace.jsonl
benchmark:
  closed_api_input_usd_per_million_tokens: 0.15
  closed_api_output_usd_per_million_tokens: 0.6
