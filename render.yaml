services:
  - type: web
    name: slothwatch-demo
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: 'sh -c ''slothwatch-demo run clean-month && exec slothwatch-demo serve --host 0.0.0.0 --port "${PORT:-10000}" --no-open'''
    healthCheckPath: /api/today
    autoDeploy: true
