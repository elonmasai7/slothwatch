[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slothwatch"
version = "0.3.0"
description = "A local agent whose best output is silence."
requires-python = ">=3.11"
dependencies = []          # core runs on the standard library alone

[project.optional-dependencies]
tabpfn   = ["tabpfn", "numpy"]   # Rung 1 / 1.5 (accept the license at platform.priorlabs.ai)
temporal = ["temporalio"]        # durable nightly workflow
sentry   = ["sentry-sdk"]        # optional agent tracing
dev      = []

[project.scripts]
slothwatch = "slothwatch.cli:main"
slothwatch-demo = "slothwatch.demo.cli:main"

[tool.setuptools.packages.find]
include = ["slothwatch*"]

[tool.setuptools.package-data]
slothwatch = ["prompts/*.txt", "dashboard.html"]
